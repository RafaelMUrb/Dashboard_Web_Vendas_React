services:
  postgres:
    image: postgres:17
    container_name: postgres-dw
    restart: unless-stopped

    environment:
      POSTGRES_USER: rafael
      POSTGRES_PASSWORD: postgres123
      POSTGRES_DB: datawarehouse

    ports:
      - "5432:5432"

    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:



